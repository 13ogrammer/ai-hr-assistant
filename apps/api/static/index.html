<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pinnacle Solutions HR Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.25rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.6; }
    #answer { white-space: pre-wrap; line-height: 1.5; }
    #sources { margin-top: 0.75rem; font-size: 0.85rem; color: #555; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Pinnacle Solutions HR Assistant</h1>
  <form id="ask-form">
    <input id="question" type="text" placeholder="Ask a question about HR policy..." autocomplete="off" required />
    <button type="submit">Ask</button>
  </form>
  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    const form = document.getElementById("ask-form");
    const questionInput = document.getElementById("question");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      button.disabled = true;
      answerEl.textContent = "Thinking...";
      answerEl.classList.remove("error");
      sourcesEl.textContent = "";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error(detail?.detail?.[0]?.msg || `Request failed (${response.status})`);
        }

        const data = await response.json();
        answerEl.textContent = data.answer;
        sourcesEl.textContent = data.sources.length ? `Sources: ${data.sources.join(", ")}` : "";
      } catch (err) {
        answerEl.textContent = err.message;
        answerEl.classList.add("error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
